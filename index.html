.eb{font-size:11px;font-weight:700;letter-spacing:.32em;color:var(--ac);margin:4px 0 14px}.hero h1{font:600 26px/1.2 'Bricolage Grotesque',sans-serif;margin:0 0 12px}.hero .row{justify-content:center;flex-wrap:wrap;margin-top:6px}.btn.o{background:transparent;color:var(--tx);box-shadow:inset 0 0 0 2px var(--co)}.tr{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:22px;padding-top:18px;border-top:1px solid var(--bd);font-size:13px;color:var(--mut)}.tr span::before{content:"✓ ";color:var(--ac);font-weight:800}
.col{text-align:center;padding:22px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:172px}.col:active,.col:hover{border-color:var(--co)}.col .ico{margin:0 auto 12px;width:56px;height:56px;border-radius:50%;background:rgba(74,201,227,.12);border:1px solid #17405f}.col b{display:block;font:600 15px/1.25 'Bricolage Grotesque',sans-serif;letter-spacing:.02em;margin-bottom:3px}.col small{display:block;color:var(--mut);font-size:12.5px;line-height:1.4}
a{color:var(--co2)}a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.stp .num{background:var(--co);color:#fff}.sx::after{background:var(--co);box-shadow:0 0 10px var(--co)}.tr span::before{color:var(--co2)}.dsc b{color:#fff}.hero p.mut,.hero .tr{color:#e3eef6}
.gsl{background:none!important;border-radius:0}.gsl img,.li.cl .t img{transition:opacity .25s}.gsl img:not([data-ok]),.li.cl .t img:not([data-ok]){opacity:0}.gsl img{filter:drop-shadow(0 8px 18px rgba(0,0,0,.4))}
.rvs{margin-top:8px}.rvs .rev:last-child{border-bottom:0}.rvm{text-align:center;margin-top:8px}.rvb{margin-top:34px;text-align:center}.rvb .btn{margin-top:0}
.btn.o{color:var(--ac);background:none;box-shadow:inset 0 0 0 1.5px var(--ac)}
.rst{margin:6px 0 10px}.rsum{display:flex;align-items:center;gap:12px;margin:4px 0 8px}.rsum b{font-size:30px}.rsum .rs{font-size:18px}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0;overflow:hidden}
.rmo{position:fixed;inset:0;z-index:80;background:rgba(2,10,20,.72);display:none;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.rmo.on{display:flex}
.rmb{position:relative;width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--cd);border:1px solid var(--bd);border-radius:24px 24px 0 0;padding:26px 18px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;animation:rmu .35s cubic-bezier(.22,1,.36,1)}
.rmb .fl{text-align:left}
.rmx{position:absolute;top:6px;right:6px;width:44px;height:44px;border:0;background:none;color:var(--mut);font-size:30px;cursor:pointer}
@keyframes rmu{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.nps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.np{padding:10px 2px;min-width:0}.np small{font-size:11px}.lks{padding:4px 16px}.lks .li:last-child{border-bottom:0}body.isadm #wf,body.isadm #up{display:none!important}
img{mix-blend-mode:normal!important}
img[src*=".jpg" i],img[src*=".jpeg" i]{background:#fff;border-radius:18px}
.lkp{position:relative;margin:8px 0 16px}.lkpb{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;min-height:58px;border-radius:16px;border:1.5px solid var(--bd);background:none;color:inherit;font:inherit;cursor:pointer}.lkp.open .lkpb{border-color:var(--co)}.lkpc{display:flex;align-items:center;gap:12px;font-weight:700}.lkpb>svg{flex:none;transition:transform .2s}.lkp.open .lkpb>svg{transform:rotate(180deg)}.lkpl{display:none;margin-top:8px;border:1.5px solid var(--bd);border-radius:16px;overflow:hidden;background:var(--cd)}.lkp.open .lkpl{display:block}.lkpo{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--bd);color:var(--mut);font:inherit;font-weight:600;cursor:pointer;text-align:left}.lkpo:last-child{border-bottom:0}.lkpo.on{color:var(--tx);background:rgba(255,120,80,.12)}

/* mejoras visuales */
.car{margin:18px -16px 6px}
.cart{animation-duration:80s}
.car:active .cart{animation-play-state:paused}
